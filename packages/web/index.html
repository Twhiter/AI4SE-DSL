<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSL easy</title>
    <style>
        /* VS Code "Dark Modern" */
        html, body { margin: 0; height: 100%; background: #1F1F1F; overflow: hidden; }
        #main { width: 100%; height: 100%; display: flex; }
        #left { flex: 1; min-width: 0; display: flex; flex-direction: column; }

        /* the views of the document, one at a time, chosen in the bar above them */
        #view-bar {
            flex: none; display: flex; align-items: stretch; height: 35px; background: #181818; border-bottom: 1px solid #2B2B2B;
            font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }
        #view-bar .view-tab {
            display: flex; align-items: center; padding: 0 16px; margin-bottom: -1px; cursor: pointer;
            border: none; border-right: 1px solid #2B2B2B; border-top: 1px solid transparent;
            background: transparent; color: #9D9D9D; font: inherit;
        }
        #view-bar .view-tab:hover { color: #CCCCCC; }
        #view-bar .view-tab[aria-selected='true'] { background: #1F1F1F; color: #FFFFFF; border-top-color: #0078D4; }
        #view-bar .view-note { margin-left: auto; align-self: center; padding: 0 12px; font-size: 12px; color: #CCA700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #views { position: relative; flex: 1; min-height: 0; }
        #views > div { position: absolute; inset: 0; }
        #views > [hidden] { display: none; }

        /* Read: the document as tables */
        #read { overflow: auto; background: #1F1F1F; color: #CCCCCC; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
        #read .read-note { margin: 12px 16px 0; padding: 6px 10px; border-left: 3px solid #CCA700; background: #2B2B2B; }
        #read .read-note[hidden] { display: none; }
        #read .read-empty { padding: 16px; color: #9D9D9D; }
        #read section { padding: 14px 16px 6px; }
        #read h2 { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #E7E7E7; }
        #read .badge {
            display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-width: 18px; height: 18px;
            padding: 0 5px; border-radius: 9px; background: #616161; color: #F8F8F8; font-size: 11px; letter-spacing: 0;
        }
        #read table { width: 100%; border-collapse: collapse; }
        #read th { text-align: left; font-size: 12px; font-weight: 600; color: #9D9D9D; padding: 4px 10px; border-bottom: 1px solid #3C3C3C; white-space: nowrap; }
        #read td { padding: 6px 10px; border-bottom: 1px solid #2B2B2B; vertical-align: top; }
        #read tbody tr:hover td { background: #2A2D2E; }
        #read .name { color: #E7E7E7; font-weight: 600; white-space: nowrap; }
        #read .chip { display: inline-block; margin: 0 4px 3px 0; padding: 0 6px; border-radius: 3px; background: #313131; border: 1px solid #3C3C3C; font-size: 12px; line-height: 18px; white-space: nowrap; }
        #read .code { font-family: Menlo, Monaco, 'Courier New', monospace; font-size: 12px; line-height: 18px; }
        #read .and { color: #C586C0; }
        #read .none { color: #6E7681; }

        /* DCR graph */
        #dcr { display: flex; flex-direction: column; background: #181818; color: #CCCCCC; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
        #dcr .dcr-toolbar { flex: none; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-bottom: 1px solid #2B2B2B; }
        #dcr .dcr-status { flex: 1; font-size: 12px; color: #9D9D9D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #dcr button { font: inherit; font-size: 12px; color: #CCCCCC; background: #313131; border: 1px solid #3C3C3C; border-radius: 3px; padding: 2px 10px; cursor: pointer; }
        #dcr button:hover { background: #3C3C3C; }
        #dcr .canvas { flex: 1; min-height: 0; background: #FFFFFF; }

        /* the Problems panel below the editor */
        #panel {
            position: relative; flex: none; height: 30%; display: flex; flex-direction: column;
            background: #181818; border-top: 1px solid #2B2B2B; color: #CCCCCC;
            font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }
        #panel .sash { position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: ns-resize; z-index: 10; }
        #panel .sash:hover, #panel .sash.active { background: #0078D4; transition: background .1s .3s; }
        #panel .panel-header { flex: none; display: flex; align-items: stretch; height: 35px; padding: 0 12px 0 16px; }
        #panel .panel-tab {
            display: flex; align-items: center; gap: 6px; padding: 0 2px;
            font-size: 11px; text-transform: uppercase; color: #E7E7E7; border-bottom: 1px solid #0078D4;
        }
        #panel .badge {
            display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
            min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
            background: #616161; color: #F8F8F8; font-size: 11px; text-transform: none;
        }
        #panel .check-status { margin-left: auto; align-self: center; font-size: 12px; color: #9D9D9D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #panel .check-status::before { content: '●'; margin-right: 6px; color: #6E7681; }
        #panel .check-status[data-state='done']::before { color: #2EA043; }
        #panel .check-status[data-state='checking']::before, #panel .check-status[data-state='loading']::before { color: #3794FF; }
        #panel .check-status[data-state='failed']::before { color: #F14C4C; }
        #panel .panel-body { flex: 1; overflow: auto; padding-bottom: 8px; }
        #panel .empty { padding: 4px 20px; color: #9D9D9D; }
        #panel .file { display: flex; align-items: center; gap: 6px; height: 22px; padding-left: 12px; cursor: pointer; color: #CCCCCC; }
        #panel .file:hover, #panel .problem:hover, #panel .related:hover { background: #2A2D2E; }
        #panel .chevron { width: 12px; text-align: center; color: #9D9D9D; }
        #panel .problem { display: flex; align-items: flex-start; gap: 6px; padding: 2px 12px 2px 34px; line-height: 18px; cursor: pointer; }
        #panel .related { display: flex; gap: 8px; padding: 0 12px 0 56px; line-height: 20px; cursor: pointer; color: #CCCCCC; }
        #panel .icon { flex: none; width: 16px; height: 18px; display: flex; align-items: center; }
        #panel .icon svg { width: 16px; height: 16px; }
        #panel .error .icon { color: #F14C4C; }
        #panel .warning .icon { color: #CCA700; }
        #panel .info .icon { color: #3794FF; }
        #panel .message { white-space: pre-wrap; }
        #panel .detail { flex: none; color: #9D9D9D; white-space: pre; }

        /* the domain description, asked for before the editor and the chat */
        #domain {
            position: fixed; inset: 0; z-index: 100; overflow: auto; box-sizing: border-box; padding: 16px;
            display: flex; align-items: center; justify-content: center;
            background: #1F1F1F; color: #CCCCCC;
            font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }
        #domain[hidden] { display: none; }
        #domain .domain-form { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 10px; }
        #domain h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; color: #E7E7E7; }
        #domain label { font-size: 12px; color: #9D9D9D; }
        #domain textarea {
            resize: vertical; box-sizing: border-box; width: 100%; min-height: 160px; padding: 8px 10px; border-radius: 4px;
            background: #313131; color: #CCCCCC; border: 1px solid #3C3C3C; font: inherit; line-height: 1.5; outline: none;
        }
        #domain textarea:focus { border-color: #0078D4; }
        #domain textarea:disabled { opacity: .6; }
        #domain .actions { display: flex; align-items: center; gap: 12px; }
        #domain .status { flex: 1; color: #9D9D9D; }
        #domain button { font: inherit; color: #FFFFFF; background: #0078D4; border: none; border-radius: 3px; padding: 6px 18px; cursor: pointer; }
        #domain button:hover { background: #026EC1; }
        #domain button:disabled { background: #3C3C3C; color: #9D9D9D; cursor: default; }

        /* the chat with the agent, right of the editor */
        #chat {
            position: relative; flex: none; width: 40%; display: flex; flex-direction: column;
            background: #181818; border-left: 1px solid #2B2B2B; color: #CCCCCC;
            font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }
        #chat .sash { position: absolute; top: 0; bottom: 0; left: -3px; width: 6px; cursor: ew-resize; z-index: 10; }
        #chat .sash:hover, #chat .sash.active { background: #0078D4; transition: background .1s .3s; }
        #chat .panel-header { flex: none; display: flex; align-items: center; gap: 12px; height: 35px; padding: 0 12px 0 16px; }
        #chat .panel-tab { align-self: stretch; display: flex; align-items: center; font-size: 11px; text-transform: uppercase; color: #E7E7E7; border-bottom: 1px solid #0078D4; }
        #chat .chat-status { flex: 1; font-size: 12px; color: #9D9D9D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #chat .chat-effort { font: inherit; font-size: 12px; color: #CCCCCC; background: #313131; border: 1px solid #3C3C3C; border-radius: 4px; padding: 1px 4px; }
        #chat .chat-session { padding-right: 12px; font-size: 12px; color: #9D9D9D; white-space: nowrap; user-select: all; }
        #chat .chat-body { flex: 1; min-height: 0; }
        #chat deep-chat { height: 100%; }
    </style>
</head>
<body>
    <div id="main">
        <div id="left">
            <div id="view-bar"></div>
            <div id="views">
                <div id="editor"></div>
                <div id="read" hidden></div>
                <div id="dcr" hidden></div>
            </div>
            <div id="panel"></div>
        </div>
        <div id="chat"></div>
    </div>
    <div id="domain"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
